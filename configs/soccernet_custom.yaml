# Custom video config for SoccerNet GSR — WITHOUT jersey number detection.
#
# Use with the custom video adapter (src/inference/run_gsr.py):
#   1. Run prepare_custom_video(video_path, data_dir, video_name)
#      to extract frames + generate INI stubs
#   2. Run the pipeline with this config:
#        tracklab -cn soccernet_custom --config-dir configs \
#          ~modules.jersey_number_detect \
#          modules/tracklet_agg=voting_role_only
#
# Details:
# - Jersey number detection (MMOCR) is excluded because OpenMMLab is
#   incompatible with Colab's Python 3.12 + torch 2.x environment.
# - The custom_video dataset config (configs/dataset/custom_video.yaml)
#   reuses the existing SoccerNetGameState loader via structure mimicry.
# - dataset.dataset_path points to data/custom_video/ which should contain:
#     valid/{video_name}/img1/000001.jpg ...
#     valid/{video_name}/seqinfo.ini
#     valid/{video_name}/gameinfo.ini
#     valid/{video_name}/gt/gt.txt (empty)
# - The tracklet_agg default (voting_role_jn) expects jersey_number columns.
#   Override at runtime with modules/tracklet_agg=voting_role_only AFTER
#   generating the voting_role_only.yaml config file (see notebook cell).

defaults:
  - dataset: custom_video
  - eval: null
  - engine: offline
  - visualization: gamestate
  - modules/bbox_detector: yolo_ultralytics
  - modules/reid: prtreid
  - modules/track: bpbreid_strong_sort
  - modules/team: kmeans_embeddings
  - modules/team_side: mean_position
  - modules/tracklet_agg: voting_role_jn
  - modules/pitch: nbjw_calib
  - modules/calibration: nbjw_calib
  - _self_

pipeline:
  - bbox_detector
  - reid
  - track
  - pitch
  - calibration
  - tracklet_agg
  - team
  - team_side

experiment_name: "custom-video-no-jersey"

data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

modules:
  bbox_detector:
    batch_size: 4
    cfg:
      min_confidence: 0.15    # default is 0.4; lowered for custom video quality
  reid: {batch_size: 32}
  track: {batch_size: 32}
  pitch: {batch_size: 1}
  calibration: {batch_size: 1}

test_tracking: True
eval_tracking: False

dataset:
  nvid: 1
  dataset_path: ${data_dir}/custom_video

visualization:
  cfg:
    save_videos: True
