# Standard football pitch dimensions (FIFA)
pitch:
  length: 105  # meters
  width: 68    # meters

# Coordinate system
# x: [0, 105] — left goal line to right goal line
# y: [0, 68]  — bottom touch line to top touch line
coordinate_system:
  x_min: 0
  x_max: 105
  y_min: 0
  y_max: 68

# Key locations (x, y) in meters
key_locations:
  center_spot: [52.5, 34]
  left_penalty_spot: [11, 34]
  right_penalty_spot: [94, 34]
  left_goal: [0, 34]
  right_goal: [105, 34]
